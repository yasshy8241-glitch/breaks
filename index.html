<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗スタッフ休憩回し管理アプリ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      touch-action: manipulation;
    }

    /* Custom scrollbars */
    .timeline-scroll::-webkit-scrollbar {
      height: 8px;
    }
    .timeline-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .timeline-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .timeline-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Out-of-shift stripe pattern */
    .out-of-shift-bg {
      background: repeating-linear-gradient(
        -45deg,
        rgba(241, 245, 249, 0.95),
        rgba(241, 245, 249, 0.95) 8px,
        rgba(226, 232, 240, 0.7) 8px,
        rgba(226, 232, 240, 0.7) 16px
      );
    }

    /* Resize handles */
    .resize-handle {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease, background-color 0.15s ease;
      cursor: col-resize;
      z-index: 25;
      touch-action: none;
    }
    .group:hover .resize-handle,
    .resizable-item:hover .resize-handle,
    .is-resizing .resize-handle {
      opacity: 1;
    }
    .resize-handle-left {
      left: -12px;
      border-radius: 4px;
    }
    .resize-handle-right {
      right: -12px;
      border-radius: 4px;
    }
    .resize-handle:hover,
    .resize-handle.active {
      background-color: rgba(255, 255, 255, 0.5);
    }
    .shift-handle:hover,
    .shift-handle.active {
      background-color: rgba(99, 102, 241, 0.3);
    }
